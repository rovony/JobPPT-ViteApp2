  License URL : https://creativecommons.org/licenses/by-sa/4.0/
  Used in     : QP2 seminar deck — Slide 23 (case3-divider)
                Calaspargase pegol / adult Ph-negative ALL.
                The lymphocyte is the parent cell that becomes a malignant
                lymphoblast in lymphoblastic leukaemia, so it is the most
                direct cellular signature for this case study. Chosen over
                bone-marrow imagery because the CS2 hero already uses CRUK's
                bone-marrow diagram and we do not want to look like we tinted
                the same illustration twice for adjacent cases.
  Recolor     : The original CRUK file already renders in a lavender/cyan
                palette (#BC95C4 / #C7EAFB / #EAE0EF) that sits inside the
                CS3 violet family. The slide mounts the SVG inline at native
                colours (no filter chain), with a soft violet halo behind
                provided by the slide composition.
  Saved on    : 2026-04-24 (QP2 deck Agent D pass)
-->


  lymphocyte-cruk.svg
  ===================
  Title       : Diagram of a lymphocyte
  Source URL  : https://commons.wikimedia.org/wiki/File:Diagram_of_a_lymphocyte_CRUK_024.svg
  File URL    : https://upload.wikimedia.org/wikipedia/commons/9/97/Diagram_of_a_lymphocyte_CRUK_024.svg
  Author      : Cancer Research UK uploader (CRUK / Wikimedia Commons)

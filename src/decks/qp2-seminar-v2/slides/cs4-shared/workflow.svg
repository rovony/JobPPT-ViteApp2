<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" font-family="'Comfortaa', 'Trebuchet MS', sans-serif">
  <defs>
    <style>
      .bg { fill: var(--bg); }
      .accent { fill: var(--sage); }
      .accent-stroke { stroke: var(--sage); }
      .muted-card { fill: var(--panel); }
      .lane-bg-light { fill: #1F1F23; }
      .cream-text { fill: var(--cream); }
      .dark-text { fill: var(--bg); }
      .muted-text { fill: var(--cream-muted); }
      .lane-header { font-weight: 700; font-size: 11px; letter-spacing: 0.12em; }
      .step-text { font-weight: 600; font-size: 11px; }
      .step-sub { font-size: 9px; font-family: 'Raleway', sans-serif; font-style: italic; }
      .tool-id { font-size: 10px; font-family: 'Courier New', monospace; font-weight: 700; }
      .gate-label { font-weight: 700; font-size: 13px; letter-spacing: 0.1em; }
      .gate-sub { font-size: 10px; font-family: 'Raleway', sans-serif; font-style: italic; }
      .audit-hash { font-size: 9px; font-family: 'Courier New', monospace; }
      .flow-arrow { stroke: var(--cream-muted); stroke-width: 1.2; fill: none; }
      .lane-divider { stroke: var(--cream-hairline); stroke-width: 0.5; stroke-dasharray: 2 2; }
    </style>
    <marker id="arrow-r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="var(--cream-muted)"/>
    </marker>
    <marker id="arrow-d" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <polygon points="0 0, 6 0, 3 6" fill="var(--cream-muted)"/>
    </marker>
  </defs>

  <rect width="1280" height="720" class="bg"/>

  <!-- Lane background tints (subtle alternating) -->
  <rect x="30" y="35" width="146" height="650" class="lane-bg-light"/>
  <rect x="322" y="35" width="366" height="650" class="lane-bg-light"/>
  <rect x="1054" y="35" width="196" height="650" class="lane-bg-light"/>

  <!-- Lane dividers -->
  <line x1="176" y1="35" x2="176" y2="685" class="lane-divider"/>
  <line x1="322" y1="35" x2="322" y2="685" class="lane-divider"/>
  <line x1="688" y1="35" x2="688" y2="685" class="lane-divider"/>
  <line x1="1054" y1="35" x2="1054" y2="685" class="lane-divider"/>

  <!-- LANE HEADERS -->
  <text x="103" y="58" text-anchor="middle" class="accent lane-header">ANALYST</text>
  <text x="249" y="58" text-anchor="middle" class="accent lane-header">SUPERVISOR</text>
  <text x="505" y="58" text-anchor="middle" class="accent lane-header">DOMAIN AGENTS</text>
  <text x="871" y="58" text-anchor="middle" class="accent lane-header">TOOLS</text>
  <text x="1152" y="58" text-anchor="middle" class="accent lane-header">AUDIT CHAIN</text>

  <!-- Header underline -->
  <line x1="30" y1="68" x2="1250" y2="68" stroke="var(--sage)" stroke-opacity="0.3" stroke-width="1"/>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- PHASE 1: SETUP & PROFILING (y 80-185) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <!-- Analyst opens conversation -->
  <g>
    <rect x="40" y="80" width="125" height="45" rx="4" ry="4" class="muted-card" stroke="var(--sage)" stroke-width="1"/>
    <text x="103" y="100" text-anchor="middle" class="cream-text step-text" font-size="9">"Build a PopPK</text>
    <text x="103" y="113" text-anchor="middle" class="cream-text step-text" font-size="9">model on this</text>
    <text x="103" y="121" text-anchor="middle" class="cream-text step-sub">dataset"</text>
  </g>

  <!-- Arrow to Supervisor -->
  <line x1="170" y1="100" x2="190" y2="100" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <!-- Supervisor classify -->
  <g>
    <rect x="195" y="82" width="120" height="42" rx="4" ry="4" class="muted-card"/>
    <text x="255" y="100" text-anchor="middle" class="cream-text step-text">Classify intent</text>
    <text x="255" y="115" text-anchor="middle" class="cream-text step-text">→ template</text>
  </g>

  <!-- Arrow to first agent -->
  <line x1="316" y1="103" x2="336" y2="103" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <!-- Data Manager + Tool T1 + Audit -->
  <g>
    <rect x="340" y="82" width="160" height="42" rx="4" ry="4" class="muted-card"/>
    <text x="420" y="100" text-anchor="middle" class="cream-text step-text">Data Manager</text>
    <text x="420" y="115" text-anchor="middle" class="muted-text step-sub">Profile dataset</text>
  </g>

  <line x1="503" y1="103" x2="700" y2="103" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <g>
    <rect x="705" y="82" width="335" height="42" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="103" class="accent tool-id">T₁</text>
    <text x="755" y="103" class="cream-text" font-size="11" font-family="Courier New">profile_dataset(...)</text>
    <text x="725" y="118" class="muted-text" font-size="9" font-family="Raleway" font-style="italic">→ schema metadata, missingness, dose levels</text>
  </g>

  <!-- Audit T1 -->
  <g>
    <rect x="1064" y="82" width="180" height="42" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="100" class="accent" font-size="9" font-weight="700">T₁ entry</text>
    <text x="1075" y="115" class="muted-text audit-hash">hash: 0x7a9f...e3c8</text>
  </g>

  <!-- NCA Agent + T2 + Audit -->
  <line x1="420" y1="125" x2="420" y2="142" class="flow-arrow" marker-end="url(#arrow-d)"/>
  <g>
    <rect x="340" y="148" width="160" height="42" rx="4" ry="4" class="muted-card"/>
    <text x="420" y="166" text-anchor="middle" class="cream-text step-text">NCA Agent</text>
    <text x="420" y="181" text-anchor="middle" class="muted-text step-sub">Compute exposure</text>
  </g>

  <line x1="503" y1="169" x2="700" y2="169" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <g>
    <rect x="705" y="148" width="335" height="42" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="169" class="accent tool-id">T₂</text>
    <text x="755" y="169" class="cream-text" font-size="11" font-family="Courier New">compute_auc_cmax(...)</text>
    <text x="725" y="184" class="muted-text" font-size="9" font-family="Raleway" font-style="italic">→ NCA summary across dose groups</text>
  </g>

  <g>
    <rect x="1064" y="148" width="180" height="42" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="166" class="accent" font-size="9" font-weight="700">T₂ entry</text>
    <text x="1075" y="181" class="muted-text audit-hash">prev_hash: T₁ ← chain</text>
  </g>

  <!-- Modeler Manager routes -->
  <line x1="420" y1="190" x2="420" y2="207" class="flow-arrow" marker-end="url(#arrow-d)"/>
  <g>
    <rect x="340" y="213" width="160" height="32" rx="4" ry="4" class="muted-card" stroke="var(--sage)" stroke-width="1"/>
    <text x="420" y="226" text-anchor="middle" class="cream-text step-text" font-size="10">Modeler Manager</text>
    <text x="420" y="238" text-anchor="middle" class="muted-text step-sub" font-size="8">Routes to PopPK Expert</text>
  </g>

  <!-- PopPK Expert + T3 + T4 (compact, two tools) -->
  <line x1="420" y1="245" x2="420" y2="262" class="flow-arrow" marker-end="url(#arrow-d)"/>
  <g>
    <rect x="340" y="268" width="160" height="55" rx="4" ry="4" class="accent"/>
    <text x="420" y="287" text-anchor="middle" class="dark-text step-text" font-size="12">PopPK Expert</text>
    <text x="420" y="302" text-anchor="middle" class="dark-text step-sub" font-size="9">Structural model</text>
    <text x="420" y="314" text-anchor="middle" class="dark-text step-sub" font-size="9">+ covariate screening</text>
  </g>

  <line x1="503" y1="285" x2="700" y2="285" class="flow-arrow" marker-end="url(#arrow-r)"/>
  <line x1="503" y1="305" x2="700" y2="305" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <g>
    <rect x="705" y="268" width="335" height="25" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="285" class="accent tool-id">T₃</text>
    <text x="755" y="285" class="cream-text" font-size="11" font-family="Courier New">fit_2cmt_structural(...)</text>
  </g>
  <g>
    <rect x="705" y="298" width="335" height="25" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="315" class="accent tool-id">T₄</text>
    <text x="755" y="315" class="cream-text" font-size="11" font-family="Courier New">screen_covariates(WT, AGE, ...)</text>
  </g>

  <g>
    <rect x="1064" y="268" width="180" height="55" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="285" class="accent" font-size="9" font-weight="700">T₃ entry</text>
    <text x="1075" y="298" class="muted-text audit-hash">prev_hash: T₂</text>
    <text x="1075" y="312" class="accent" font-size="9" font-weight="700">T₄ entry</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- GATE 1 (full-width band y 335-372) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="30" y="335" width="1220" height="38" class="accent"/>
    <text x="640" y="356" text-anchor="middle" class="dark-text gate-label">★ GATE 1 · BASE MODEL SELECTION</text>
    <text x="640" y="368" text-anchor="middle" class="dark-text gate-sub">Analyst confirms structural model before covariate work begins</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- PHASE 2: FINAL ESTIMATION (y 385-425) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <line x1="420" y1="375" x2="420" y2="390" class="flow-arrow" marker-end="url(#arrow-d)"/>
  <g>
    <rect x="340" y="395" width="160" height="32" rx="4" ry="4" class="accent"/>
    <text x="420" y="410" text-anchor="middle" class="dark-text step-text">PopPK Expert</text>
    <text x="420" y="421" text-anchor="middle" class="dark-text step-sub" font-size="9">Final estimation</text>
  </g>

  <line x1="503" y1="411" x2="700" y2="411" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <g>
    <rect x="705" y="395" width="335" height="32" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="412" class="accent tool-id">T₅</text>
    <text x="755" y="412" class="cream-text" font-size="11" font-family="Courier New">estimate_final_params(...)</text>
    <text x="725" y="423" class="muted-text" font-size="9" font-family="Raleway" font-style="italic">→ θ, η, ε estimates with %RSE</text>
  </g>

  <g>
    <rect x="1064" y="395" width="180" height="32" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="411" class="accent" font-size="9" font-weight="700">T₅ entry</text>
    <text x="1075" y="423" class="muted-text audit-hash">prev_hash: T₄ ← chain</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- GATE 2 (y 437-472) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="30" y="437" width="1220" height="35" class="accent"/>
    <text x="640" y="457" text-anchor="middle" class="dark-text gate-label">★ GATE 2 · COVARIATE FINALIZATION</text>
    <text x="640" y="469" text-anchor="middle" class="dark-text gate-sub">Analyst reviews retained covariates and inclusion rationale</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- PHASE 3: DIAGNOSTICS (y 482-520) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="340" y="487" width="160" height="32" rx="4" ry="4" class="muted-card"/>
    <text x="420" y="503" text-anchor="middle" class="cream-text step-text">QC Agent</text>
    <text x="420" y="514" text-anchor="middle" class="muted-text step-sub" font-size="9">15-check diagnostic suite</text>
  </g>

  <line x1="503" y1="503" x2="700" y2="503" class="flow-arrow" marker-end="url(#arrow-r)"/>

  <g>
    <rect x="705" y="487" width="335" height="32" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="504" class="accent tool-id">T₆</text>
    <text x="755" y="504" class="cream-text" font-size="11" font-family="Courier New">run_diagnostics(GOF, VPC, bootstrap)</text>
  </g>

  <g>
    <rect x="1064" y="487" width="180" height="32" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="503" class="accent" font-size="9" font-weight="700">T₆ entry</text>
    <text x="1075" y="515" class="muted-text audit-hash">prev_hash: T₅</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- GATE 3 (y 530-565) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="30" y="530" width="1220" height="35" class="accent"/>
    <text x="640" y="550" text-anchor="middle" class="dark-text gate-label">★ GATE 3 · FINAL MODEL DESIGNATION</text>
    <text x="640" y="562" text-anchor="middle" class="dark-text gate-sub">Analyst locks parameter estimates; triggers downstream simulation</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- PHASE 4: SIMULATION + REPORT (y 575-625) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="340" y="578" width="160" height="22" rx="4" ry="4" class="muted-card"/>
    <text x="420" y="593" text-anchor="middle" class="cream-text step-text" font-size="10">Simulator</text>
  </g>
  <g>
    <rect x="705" y="578" width="335" height="22" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="594" class="accent tool-id">T₇</text>
    <text x="755" y="594" class="cream-text" font-size="11" font-family="Courier New">target_attainment_sim(...)</text>
  </g>
  <line x1="503" y1="589" x2="700" y2="589" class="flow-arrow" marker-end="url(#arrow-r)"/>
  <g>
    <rect x="1064" y="578" width="180" height="22" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="593" class="accent" font-size="9" font-weight="700">T₇ entry</text>
  </g>

  <g>
    <rect x="340" y="605" width="160" height="22" rx="4" ry="4" class="muted-card"/>
    <text x="420" y="620" text-anchor="middle" class="cream-text step-text" font-size="10">Report Agent</text>
  </g>
  <g>
    <rect x="705" y="605" width="335" height="22" rx="4" ry="4" class="muted-card"/>
    <text x="725" y="621" class="accent tool-id">T₈</text>
    <text x="755" y="621" class="cream-text" font-size="11" font-family="Courier New">draft_m15_package(...)</text>
  </g>
  <line x1="503" y1="616" x2="700" y2="616" class="flow-arrow" marker-end="url(#arrow-r)"/>
  <g>
    <rect x="1064" y="605" width="180" height="22" rx="3" ry="3" class="muted-card" stroke="var(--cream-hairline)" stroke-width="0.5"/>
    <text x="1075" y="620" class="accent" font-size="9" font-weight="700">T₈ entry</text>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <!-- GATE 4 (y 637-672) -->
  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

  <g>
    <rect x="30" y="637" width="1220" height="35" class="accent"/>
    <text x="640" y="657" text-anchor="middle" class="dark-text gate-label">★ GATE 4 · REPORT APPROVAL</text>
    <text x="640" y="669" text-anchor="middle" class="dark-text gate-sub">Nothing leaves the platform without explicit analyst sign-off</text>
  </g>

  <!-- Bottom assertion -->
  <text x="640" y="700" text-anchor="middle" class="cream-text" font-size="12" font-style="italic">
    Every gate produces a record: who approved, when, what alternatives were considered, what the rationale was.
  </text>
  <text x="640" y="715" text-anchor="middle" class="accent" font-size="11" font-weight="700">
    The audit trail is a regulatory artifact, not a side effect.
  </text>
</svg>
